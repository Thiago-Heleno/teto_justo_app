name: Backend tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            src/backend/requirements.txt
            src/backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests without external services
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_KEY: unit-test-placeholder
        run: python -m pytest -q tests/test_autenticacao_unitario.py tests/test_servico_casa_unitario.py tests/test_servico_sessao_unitario.py tests/test_servico_tarefa_unitario.py tests/test_servico_usuario_unitario.py tests/test_pertencer_unitarios.py

      - name: Run integration tests against Supabase
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.TEST_SUPABASE_KEY }}
        run: python -m pytest -q tests/test_sessoes_integracao.py tests/test_tarefas_integracao.py tests/test_usuarios_integracao.py tests/test_casa_integracao.py tests/test_pertencer_integracao.py
