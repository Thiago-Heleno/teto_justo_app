services:
  backend:
    build: ./src/backend
    ports:
      - "8000:8000"
    volumes:
      - ./src/backend:/app
    env_file:
      - .env
  rotatividade-worker:
    build: ./src/backend
    command: python -m services.rotatividade
    volumes:
      - ./src/backend:/app
    env_file:
      - .env
