name: Analise Estatica (Linters e SAST)

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  # Execução DO BACKEND (PYTHON)
  backend-analysis:
    name: Backend (Ruff & Bandit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/backend

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar ferramentas do Backend
      run: |
        python -m pip install --upgrade pip
        pip install ruff bandit

    - name: Linter - Rodar o Ruff
      run: ruff check .

    - name: SAST - Rodar o Bandit
      run: bandit -r . -x ./venv,./tests

  # 2. TAREFA DO FRONTEND (NODE / EXPO)
  frontend-analysis:
    name: Frontend (ESLint & Auditoria)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/frontend

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar dependências do projeto
      run: npm install

    - name: Linter e SAST (Regras de Segurança)
      run: npm run lint

    - name: Auditoria de Dependências Hackeadas (SCA)
      run: npm run sast:audit